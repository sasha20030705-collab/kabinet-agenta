<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо-кабинет</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #fff; color: #101820;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  form { width: 100%; max-width: 340px; padding: 24px 20px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #5b6470; font-size: 14px; }
  input, button { width: 100%; box-sizing: border-box; height: 48px; border-radius: 10px; font: inherit; }
  input { border: 1px solid #c9ced6; padding: 0 14px; margin-bottom: 12px; }
  input:focus { outline: 2px solid #7F2EC3; outline-offset: 1px; border-color: #7F2EC3; }
  button { border: 0; background: #FF9800; color: #101820; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin: 12px 0 0; font-size: 14px; color: #C4203A; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Демо-кабинет</h1>
  <p>Введите пароль, который вам передали.</p>
  <input type="text" name="username" value="demo" autocomplete="username" hidden>
  <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Пароль" required autofocus>
  <button id="go" type="submit">Открыть</button>
  <div id="msg" role="alert"></div>
</form>
<script>
(function () {
  var ITER = 600000, KEY = 'demo-pass';
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function say(t) { msg.textContent = t || ''; }
  function busy(on) { go.disabled = on; go.textContent = on ? 'Открываю…' : 'Открыть'; }
  function remember(p) { try { sessionStorage.setItem(KEY, p); } catch (e) {} }
  function forget() { try { sessionStorage.removeItem(KEY); } catch (e) {} }
  function saved() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }

  async function open(password) {
    if (!window.crypto || !crypto.subtle) throw new Error('old');
    var packed = typeof DecompressionStream === 'function';
    var res = await fetch(packed ? 'a.bin' : 'b.bin', { cache: 'no-cache' });
    if (!res.ok) throw new Error('net');
    var buf = new Uint8Array(await res.arrayBuffer());
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: buf.slice(0, 16), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
    } catch (e) { throw new Error('pass'); }
    if (packed) {
      var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }
    return new TextDecoder().decode(plain);
  }

  async function run(password, silent) {
    busy(true); say('');
    try {
      var html = await open(password);
      remember(password);
      document.open(); document.write(html); document.close();
    } catch (e) {
      busy(false);
      forget();
      if (silent) return;
      if (e.message === 'pass') { say('Пароль не подошёл.'); pw.select(); }
      else if (e.message === 'old') say('Этот браузер слишком старый. Откройте ссылку в другом браузере.');
      else say('Не удалось загрузить кабинет. Проверьте интернет и попробуйте ещё раз.');
    }
  }

  f.addEventListener('submit', function (ev) { ev.preventDefault(); if (pw.value) run(pw.value, false); });
  var s = saved();
  if (s) run(s, true);
})();
</script>
</body>
</html>
